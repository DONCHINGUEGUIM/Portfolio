<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05236"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect x="40" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">KOST</text>
  <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#e05236">Store</text>
  <text x="40" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666">Commercial website · Next.js storefront</text>
  <rect x="40" y="290" width="70" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="75" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Next.js</text>
  <rect x="120" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="150" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">React</text>
  <rect x="190" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="220" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Vercel</text>
  <!-- Browser mockup -->
  <g transform="translate(340, 80)">
    <rect x="0" y="0" width="220" height="240" rx="10" fill="#111111" stroke="#333333" stroke-width="1"/>
    <rect x="0" y="0" width="220" height="28" rx="10" fill="#1a1a1a"/>
    <rect x="0" y="20" width="220" height="8" fill="#1a1a1a"/>
    <circle cx="16" cy="14" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="14" r="5" fill="#febc2e"/>
    <circle cx="52" cy="14" r="5" fill="#28c840"/>
    <rect x="70" y="8" width="130" height="12" rx="6" fill="#0a0a0a"/>
    <text x="135" y="17" font-family="system-ui" font-size="7" fill="#666666" text-anchor="middle">kost7.store</text>
    <!-- Page content -->
    <rect x="12" y="40" width="196" height="16" rx="3" fill="#e0523630"/>
    <text x="110" y="52" font-family="system-ui" font-size="9" fill="#e05236" text-anchor="middle" font-weight="700">KOST STORE</text>
    <rect x="12" y="66" width="60" height="8" rx="2" fill="#ffffff10"/>
    <rect x="148" y="66" width="60" height="8" rx="2" fill="#ffffff10"/>
    <!-- Product grid -->
    <rect x="12" y="84" width="62" height="70" rx="4" fill="#1a1a1a" stroke="#333333" stroke-width="0.5"/>
    <rect x="18" y="90" width="50" height="36" rx="2" fill="#e0523620"/>
    <rect x="18" y="132" width="40" height="6" rx="1" fill="#ffffff15"/>
    <rect x="18" y="142" width="24" height="6" rx="1" fill="#e0523640"/>
    <rect x="79" y="84" width="62" height="70" rx="4" fill="#1a1a1a" stroke="#333333" stroke-width="0.5"/>
    <rect x="85" y="90" width="50" height="36" rx="2" fill="#e0523620"/>
    <rect x="85" y="132" width="40" height="6" rx="1" fill="#ffffff15"/>
    <rect x="85" y="142" width="24" height="6" rx="1" fill="#e0523640"/>
    <rect x="146" y="84" width="62" height="70" rx="4" fill="#1a1a1a" stroke="#333333" stroke-width="0.5"/>
    <rect x="152" y="90" width="50" height="36" rx="2" fill="#e0523620"/>
    <rect x="152" y="132" width="40" height="6" rx="1" fill="#ffffff15"/>
    <rect x="152" y="142" width="24" height="6" rx="1" fill="#e0523640"/>
    <!-- Cart bar -->
    <rect x="12" y="166" width="196" height="24" rx="4" fill="#e0523620" stroke="#e0523640" stroke-width="0.5"/>
    <text x="110" y="181" font-family="system-ui" font-size="8" fill="#e05236" text-anchor="middle" font-weight="600">Checkout · Mobile Money</text>
    <rect x="12" y="200" width="196" height="24" rx="4" fill="#0a0a0a" stroke="#333333" stroke-width="0.5"/>
    <rect x="20" y="208" width="80" height="8" rx="2" fill="#ffffff10"/>
    <rect x="160" y="206" width="40" height="12" rx="6" fill="url(#accent)"/>
  </g>
</svg>
