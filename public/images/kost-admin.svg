    <rect x="6" y="40" width="28" height="10" rx="2" fill="#ffffff08"/>
    <rect x="6" y="56" width="28" height="10" rx="2" fill="#ffffff08"/>
    <rect x="6" y="72" width="28" height="10" rx="2" fill="#ffffff08"/>
