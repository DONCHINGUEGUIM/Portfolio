<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05236"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect x="40" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">NotchPay</text>
  <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#e05236">Gateway</text>
  <text x="40" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666">Mobile Money · Payment API · Fintech</text>
  <rect x="40" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="70" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Python</text>
  <rect x="110" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="140" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Flask</text>
  <rect x="180" y="290" width="100" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="230" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Mobile Money</text>
  <!-- Payment card -->
  <g transform="translate(420, 90)">
    <rect x="0" y="0" width="150" height="95" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="0.5"/>
    <rect x="12" y="12" width="30" height="20" rx="3" fill="#e0523630"/>
    <text x="27" y="26" font-family="system-ui" font-size="8" font-weight="700" fill="#e05236" text-anchor="middle">NP</text>
    <text x="12" y="50" font-family="monospace" font-size="9" fill="#888888">**** **** **** 4242</text>
    <text x="12" y="70" font-family="system-ui" font-size="7" fill="#555555">NOTCHPAY</text>
    <text x="12" y="82" font-family="system-ui" font-size="7" fill="#555555">MOBILE MONEY</text>
    <!-- Signal waves -->
    <circle cx="130" cy="20" r="12" fill="none" stroke="#e0523620" stroke-width="0.5"/>
    <circle cx="130" cy="20" r="8" fill="none" stroke="#e0523630" stroke-width="0.5"/>
    <circle cx="130" cy="20" r="4" fill="#e0523620"/>
    <!-- Terminal window -->
    <rect x="0" y="110" width="150" height="80" rx="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <rect x="0" y="110" width="150" height="16" rx="6" fill="#1a1a1a"/>
    <circle cx="12" cy="118" r="3" fill="#ff5f57"/>
    <circle cx="22" cy="118" r="3" fill="#febc2e"/>
    <circle cx="32" cy="118" r="3" fill="#28c840"/>
    <text x="8" y="140" font-family="monospace" font-size="7" fill="#e05236">$</text>
    <text x="16" y="140" font-family="monospace" font-size="7" fill="#888888">curl -X POST</text>
    <text x="12" y="152" font-family="monospace" font-size="7" fill="#888888">  /api/pay</text>
    <text x="12" y="168" font-family="monospace" font-size="7" fill="#28c840">✓ 200 OK</text>
    <text x="12" y="180" font-family="monospace" font-size="6" fill="#555555">{"status":"success"}</text>
  </g>
  <circle cx="540" cy="60" r="3" fill="#e0523640"/>
  <circle cx="560" cy="80" r="2" fill="#e0523630"/>
</svg>
