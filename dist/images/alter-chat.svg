<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05236"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect x="40" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Alter</text>
  <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#e05236">Chat</text>
  <text x="40" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666">Real-time chat · WebSocket · Full-stack</text>
  <rect x="40" y="290" width="72" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="76" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Next.js</text>
  <rect x="120" y="290" width="72" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="156" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Socket.io</text>
  <rect x="200" y="290" width="72" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="236" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">TypeScript</text>
  <!-- Chat bubbles -->
  <g transform="translate(400, 80)">
    <!-- Left bubble -->
    <rect x="0" y="0" width="140" height="40" rx="12" fill="#1e1e1e" stroke="#333333" stroke-width="0.5"/>
    <circle cx="20" cy="20" r="10" fill="#e0523630"/>
    <rect x="38" y="12" width="80" height="6" rx="2" fill="#ffffff15"/>
    <rect x="38" y="22" width="50" height="6" rx="2" fill="#ffffff10"/>
    <!-- Right bubble -->
    <rect x="60" y="55" width="140" height="40" rx="12" fill="#e0523620" stroke="#e0523640" stroke-width="0.5"/>
    <circle cx="180" cy="75" r="10" fill="#e0523640"/>
    <rect x="80" y="67" width="70" height="6" rx="2" fill="#ffffff20"/>
    <rect x="80" y="77" width="90" height="6" rx="2" fill="#ffffff15"/>
    <!-- Left bubble 2 -->
    <rect x="0" y="110" width="160" height="40" rx="12" fill="#1e1e1e" stroke="#333333" stroke-width="0.5"/>
    <circle cx="20" cy="130" r="10" fill="#e0523630"/>
    <rect x="38" y="122" width="100" height="6" rx="2" fill="#ffffff15"/>
    <rect x="38" y="132" width="60" height="6" rx="2" fill="#ffffff10"/>
    <!-- Typing indicator -->
    <rect x="60" y="165" width="100" height="32" rx="12" fill="#1e1e1e" stroke="#333333" stroke-width="0.5"/>
    <circle cx="85" cy="181" r="3" fill="#e0523660"/>
    <circle cx="100" cy="181" r="3" fill="#e0523640"/>
    <circle cx="115" cy="181" r="3" fill="#e0523620"/>
  </g>
  <circle cx="540" cy="60" r="3" fill="#e0523640"/>
  <circle cx="560" cy="80" r="2" fill="#e0523630"/>
  <circle cx="520" cy="40" r="2" fill="#e0523620"/>
</svg>
