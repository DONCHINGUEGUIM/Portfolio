<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05236"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect x="40" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">KOST</text>
  <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#e05236">Admin Panel</text>
  <text x="40" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666">Dashboard · CRUD · Firebase Backend</text>
  <rect x="40" y="290" width="72" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="76" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Flutter</text>
  <rect x="120" y="290" width="72" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="156" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Firebase</text>
  <rect x="200" y="290" width="72" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="236" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">DataTable2</text>
  <!-- Dashboard mockup -->
  <g transform="translate(380, 70)">
    <!-- Window -->
    <rect x="0" y="0" width="190" height="130" rx="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="190" height="16" rx="6" fill="#1a1a1a"/>
    <circle cx="10" cy="8" r="3" fill="#ff5f57"/>
