    <rect x="134" y="102" width="28" height="4" rx="1" fill="#e0523620"/>
    <rect x="48" y="110" width="117" height="8" rx="1" fill="#ffffff06"/>
    <rect x="52" y="112" width="42" height="4" rx="1" fill="#ffffff10"/>
    <rect x="100" y="112" width="28" height="4" rx="1" fill="#ffffff10"/>
    <rect x="134" y="112" width="28" height="4" rx="1" fill="#e0523620"/>
  </g>
  <circle cx="540" cy="60" r="3" fill="#e0523640"/>
  <circle cx="560" cy="80" r="2" fill="#e0523630"/>
