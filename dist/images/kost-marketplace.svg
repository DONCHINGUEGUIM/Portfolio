<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05236"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <!-- Accent line -->
  <rect x="40" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Project name -->
  <text x="40" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">KOST</text>
  <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#e05236">Marketplace</text>
  <!-- Description -->
  <text x="40" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666">Full-stack e-commerce · Mobile Money Payments</text>
  <!-- Tech tags -->
  <rect x="40" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="70" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Flutter</text>
  <rect x="110" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="140" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Firebase</text>
  <rect x="180" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="210" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">GetX</text>
  <!-- Phone mockup -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="120" height="240" rx="16" fill="#111111" stroke="#333333" stroke-width="1"/>
    <rect x="10" y="20" width="100" height="180" rx="4" fill="#1a1a1a"/>
    <!-- Screen content -->
    <rect x="15" y="25" width="90" height="12" rx="2" fill="#e0523630"/>
    <text x="60" y="35" font-family="system-ui" font-size="7" fill="#e05236" text-anchor="middle" font-weight="600">KOST</text>
    <rect x="15" y="45" width="40" height="8" rx="2" fill="#ffffff10"/>
    <rect x="60" y="45" width="40" height="8" rx="2" fill="#ffffff10"/>
    <rect x="15" y="60" width="30" height="50" rx="4" fill="#ffffff08"/>
    <rect x="50" y="60" width="30" height="50" rx="4" fill="#ffffff08"/>
    <rect x="85" y="60" width="30" height="50" rx="4" fill="#ffffff08"/>
    <rect x="15" y="115" width="30" height="50" rx="4" fill="#ffffff08"/>
    <rect x="50" y="115" width="30" height="50" rx="4" fill="#ffffff08"/>
    <rect x="85" y="115" width="30" height="50" rx="4" fill="#ffffff08"/>
    <rect x="15" y="175" width="90" height="16" rx="8" fill="#e05236"/>
    <text x="60" y="186" font-family="system-ui" font-size="6" fill="#ffffff" text-anchor="middle" font-weight="600">Checkout</text>
    <!-- Home indicator -->
    <rect x="40" y="210" width="40" height="3" rx="1.5" fill="#ffffff20"/>
  </g>
  <!-- Floating dots -->
  <circle cx="540" cy="60" r="3" fill="#e0523640"/>
  <circle cx="560" cy="80" r="2" fill="#e0523630"/>
  <circle cx="520" cy="40" r="2" fill="#e0523620"/>
</svg>
