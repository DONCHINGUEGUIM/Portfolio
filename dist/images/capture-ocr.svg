<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05236"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect x="40" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Capture</text>
  <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#e05236">OCR</text>
  <text x="40" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666">Offline Text Recognition · On-device ML</text>
  <rect x="40" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="70" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Flutter</text>
  <rect x="110" y="290" width="50" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="135" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">OCR</text>
  <rect x="170" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="200" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Mobile</text>
  <!-- Phone with scan effect -->
  <g transform="translate(420, 70)">
    <!-- Phone body -->
    <rect x="0" y="0" width="130" height="260" rx="16" fill="#111111" stroke="#333333" stroke-width="1"/>
    <!-- Screen -->
    <rect x="8" y="20" width="114" height="210" rx="4" fill="#1a1a1a"/>
    <!-- Camera viewfinder -->
    <rect x="15" y="30" width="100" height="80" rx="4" fill="#0a0a0a" stroke="#e0523630" stroke-width="0.5"/>
    <!-- Document in viewfinder -->
    <rect x="25" y="40" width="80" height="55" rx="2" fill="#ffffff08"/>
    <rect x="30" y="45" width="50" height="3" rx="1" fill="#ffffff15"/>
    <rect x="30" y="52" width="60" height="3" rx="1" fill="#ffffff10"/>
    <rect x="30" y="59" width="45" height="3" rx="1" fill="#ffffff10"/>
    <rect x="30" y="66" width="55" height="3" rx="1" fill="#ffffff10"/>
    <rect x="30" y="73" width="40" height="3" rx="1" fill="#ffffff10"/>
    <rect x="30" y="80" width="60" height="3" rx="1" fill="#ffffff10"/>
    <!-- Scan line -->
    <line x1="15" y1="65" x2="115" y2="65" stroke="#e05236" stroke-width="1" opacity="0.6"/>
    <line x1="15" y1="63" x2="115" y2="63" stroke="#e05236" stroke-width="0.5" opacity="0.3"/>
    <!-- Scan corners -->
    <path d="M 20 35 L 20 30 L 25 30" fill="none" stroke="#e05236" stroke-width="1.5"/>
    <path d="M 105 35 L 110 35 L 110 30" fill="none" stroke="#e05236" stroke-width="1.5" transform="rotate(90 110 30)"/>
    <path d="M 20 105 L 20 110 L 25 110" fill="none" stroke="#e05236" stroke-width="1.5"/>
    <path d="M 105 105 L 110 105 L 110 110" fill="none" stroke="#e05236" stroke-width="1.5"/>
    <!-- Extracted text preview -->
    <rect x="15" y="120" width="100" height="60" rx="4" fill="#1e1e1e" stroke="#333333" stroke-width="0.3"/>
    <text x="22" y="136" font-family="monospace" font-size="7" fill="#e05236">Extracted:</text>
    <text x="22" y="148" font-family="monospace" font-size="6" fill="#888888">"Lorem ipsum dolor</text>
    <text x="22" y="157" font-family="monospace" font-size="6" fill="#888888"> sit amet consectetur"</text>
    <text x="22" y="170" font-family="monospace" font-size="6" fill="#28c840">✓ 38 words found</text>
    <!-- Bottom buttons -->
    <rect x="25" y="195" width="80" height="22" rx="11" fill="#e05236"/>
    <text x="65" y="210" font-family="system-ui" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">Scan Now</text>
    <!-- Home indicator -->
    <rect x="40" y="240" width="50" height="3" rx="1.5" fill="#ffffff20"/>
  </g>
  <circle cx="540" cy="60" r="3" fill="#e0523640"/>
  <circle cx="560" cy="80" r="2" fill="#e0523630"/>
</svg>
