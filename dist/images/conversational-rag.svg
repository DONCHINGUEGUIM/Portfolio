<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05236"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect x="40" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Conversational</text>
  <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#e05236">RAG</text>
  <text x="40" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666">PDF Q&amp;A · Vector Search · LLM Pipeline</text>
  <rect x="40" y="290" width="60" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="70" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Python</text>
  <rect x="110" y="290" width="80" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="150" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">LangChain</text>
  <rect x="200" y="290" width="65" height="24" rx="12" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
  <text x="232" y="306" font-family="system-ui" font-size="10" font-weight="600" fill="#e05236" text-anchor="middle">Docker</text>
  <!-- RAG pipeline diagram -->
  <g transform="translate(400, 100)">
    <!-- PDF doc -->
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#1e1e1e" stroke="#333333" stroke-width="0.5"/>
    <rect x="12" y="15" width="56" height="4" rx="1" fill="#ffffff15"/>
    <rect x="12" y="24" width="40" height="4" rx="1" fill="#ffffff10"/>
    <rect x="12" y="33" width="50" height="4" rx="1" fill="#ffffff10"/>
    <rect x="12" y="42" width="35" height="4" rx="1" fill="#ffffff10"/>
    <rect x="12" y="51" width="56" height="4" rx="1" fill="#ffffff10"/>
    <rect x="12" y="60" width="45" height="4" rx="1" fill="#ffffff10"/>
    <text x="40" y="85" font-family="system-ui" font-size="8" fill="#666666" text-anchor="middle">PDF</text>
    <!-- Arrow -->
    <line x1="85" y1="50" x2="110" y2="50" stroke="#e0523660" stroke-width="1" stroke-dasharray="3,2"/>
    <polygon points="110,47 116,50 110,53" fill="#e0523660"/>
    <!-- Embeddings (brain) -->
    <circle cx="140" cy="50" r="30" fill="#1e1e1e" stroke="#e0523640" stroke-width="0.5"/>
    <circle cx="130" cy="42" r="4" fill="#e0523630"/>
    <circle cx="150" cy="38" r="3" fill="#e0523620"/>
    <circle cx="145" cy="55" r="5" fill="#e0523625"/>
    <circle cx="135" cy="62" r="3" fill="#e0523620"/>
    <circle cx="155" cy="50" r="4" fill="#e0523615"/>
    <line x1="130" y1="42" x2="145" y2="55" stroke="#e0523620" stroke-width="0.5"/>
    <line x1="150" y1="38" x2="145" y2="55" stroke="#e0523620" stroke-width="0.5"/>
    <line x1="135" y1="62" x2="145" y2="55" stroke="#e0523620" stroke-width="0.5"/>
    <text x="140" y="95" font-family="system-ui" font-size="8" fill="#666666" text-anchor="middle">Qdrant</text>
    <!-- Arrow -->
    <line x1="175" y1="50" x2="200" y2="50" stroke="#e0523660" stroke-width="1" stroke-dasharray="3,2"/>
    <polygon points="200,47 206,50 200,53" fill="#e0523660"/>
    <!-- LLM -->
    <rect x="210" y="20" width="70" height="60" rx="8" fill="#e0523615" stroke="#e0523630" stroke-width="0.5"/>
    <text x="245" y="48" font-family="system-ui" font-size="10" font-weight="700" fill="#e05236" text-anchor="middle">Groq</text>
    <text x="245" y="62" font-family="system-ui" font-size="7" fill="#888888" text-anchor="middle">LLM</text>
    <text x="245" y="100" font-family="system-ui" font-size="8" fill="#666666" text-anchor="middle">Answer</text>
  </g>
  <circle cx="540" cy="60" r="3" fill="#e0523640"/>
  <circle cx="560" cy="80" r="2" fill="#e0523630"/>
</svg>
