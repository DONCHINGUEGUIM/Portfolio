    <rect x="48" y="66" width="117" height="8" rx="1" fill="#ffffff06"/>
    <rect x="52" y="68" width="40" height="4" rx="1" fill="#ffffff10"/>
    <rect x="98" y="68" width="30" height="4" rx="1" fill="#ffffff10"/>
    <rect x="134" y="68" width="28" height="4" rx="1" fill="#e0523620"/>
